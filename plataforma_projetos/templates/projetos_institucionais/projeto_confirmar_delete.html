{% extends 'base2.html' %}

{% block title %}Excluir Projeto{% endblock %}

{% block content %}
<div class="container-fluid py-4 px-4" style="max-width: 600px;">

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4 text-center">

            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
            </div>

            <h4 class="mb-1">Excluir Projeto</h4>
            <p class="text-muted mb-4">
                Tem certeza que deseja excluir o projeto
                <strong>"{{ projeto.titulo|default:'(sem título)' }}"</strong>?
                <br>
                <span class="text-danger small">Esta ação não pode ser desfeita.</span>
            </p>

            <form method="post" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{% url 'projeto_dashboard' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Cancelar
                </a>
                <button type="submit" class="btn btn-danger"
                        data-confirmation-help="Confirmar a exclusão definitiva deste rascunho">
                    <i class="bi bi-trash me-1"></i>Sim, excluir
                </button>
            </form>

        </div>
    </div>

</div>
{% endblock %}
