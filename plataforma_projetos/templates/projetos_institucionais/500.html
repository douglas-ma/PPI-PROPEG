{%% load static %%}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro 500 — PROPEG/UFAC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="{%% static 'imagens/favicon.ico' %%}" type="image/x-icon">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .erro-card {
      background: #fff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 520px;
      width: 100%;
    }
    .erro-codigo {
      font-size: 5rem;
      font-weight: 800;
      color: #dc3545;
      line-height: 1;
      margin-bottom: .5rem;
    }
    .erro-titulo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: .5rem;
    }
    .erro-desc {
      color: #777;
      font-size: .93rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="erro-card">
    <div class="mb-3">
      <img src="{%% static 'imagens/logo_ufac.png' %%}" alt="UFAC" style="height:40px;opacity:.6;">
    </div>
    <div class="mb-2">
      <i class="bi bi-exclamation-triangle" style="font-size:3rem;color:#dc3545;"></i>
    </div>
    <div class="erro-codigo">500</div>
    <div class="erro-titulo">Erro Interno do Servidor</div>
    <p class="erro-desc">Ocorreu um erro inesperado no servidor. Nossa equipe já foi notificada. Tente novamente em alguns instantes.</p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Voltar
      </a>
      <a href="/" class="btn btn-primary btn-sm">
        <i class="bi bi-house me-1"></i>Página Inicial
      </a>
    </div>
    <p class="mt-4 mb-0" style="font-size:.75rem;color:#bbb;">
      PROPEG — Plataforma de Projetos Institucionais · UFAC
    </p>
  </div>
</body>
</html>
