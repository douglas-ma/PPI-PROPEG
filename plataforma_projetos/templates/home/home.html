{% extends 'base.html' %}
    <!-- {% block mascaras %}
        $("#id_cpf").mask("999.999.999-99");
    {% endblock %} -->
{% block title %}Plataforma de Projetos{% endblock %}
{% block content %}
    <main class="main-section d-flex align-items-center justify-content-center">
        <div class="container text-center text-lg-start d-lg-flex align-items-center justify-content-between">
            
            <!-- Forma orgânica -->
            <div class="shape d-none d-lg-block"></div>

            <!-- Texto -->
            <div class="content text-center">
                <h2 class="fw-bold">PPI</h2>
                <h3 class="fw-semibold mb-3">Cadastro de Projetos</h3>
                <p class="text-muted mb-4">
                    Realize seu login ou registre-se na plataforma para <br>
                    explorar projetos de extensão ou cadastrá-los.
                </p>
                <div>
                    <a href="{% url 'login' 'coordenador' %}" class="btn btn-outline-primary me-2">Login como Coordenador</a>
                    <a href="{% url 'login' 'aluno' %}" class="btn btn-outline-primary">Login como Aluno</a>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
