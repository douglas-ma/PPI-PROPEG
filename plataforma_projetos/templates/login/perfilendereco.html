{% extends "base2.html" %}

{% block title %}Editar Endereço{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="mb-0">Meu Endereço</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-9 mb-3">
                        <label for="{{ form.rua.id_for_label }}" class="form-label">Rua</label>
                        {{ form.rua }}
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="{{ form.numero.id_for_label }}" class="form-label">Número</label>
                        {{ form.numero }}
                    </div>
                </div>

                <div class="mb-3">
                    <label for="{{ form.complemento.id_for_label }}" class="form-label">Complemento</label>
                    {{ form.complemento }}
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.bairro.id_for_label }}" class="form-label">Bairro</label>
                        {{ form.bairro }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.cidade.id_for_label }}" class="form-label">Cidade</label>
                        {{ form.cidade }}
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.estado.id_for_label }}" class="form-label">Estado (UF)</label>
                        {{ form.estado }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.cep.id_for_label }}" class="form-label">CEP</label>
                        {{ form.cep }}
                    </div>
                </div>

                <hr>
                
                <button type="submit" class="btn btn-success">Salvar Endereço</button>
                <a href="{% url 'perfil' %}" class="btn btn-danger">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
