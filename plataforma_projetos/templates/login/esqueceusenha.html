{% extends "base.html" %}

{% block title %}Recuperação de Senha{% endblock %}

{% block content %}
<main class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f5f7fb;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">
        
        <!-- Título dinâmico -->
        <h2 class="fw-bold mb-4 text-center">Esqueceu sua Senha?</h2>
        <p class="text-muted text-center mb-4">
            Um e-mail com instruções para renovar sua senha será enviado o endereço de e-mail do CPF provido abaixo.
        </p>
        <!-- Formulário -->
        <form method="post">
            {% csrf_token %}

            <!-- CPF -->
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
            </div>

            <!-- Botão principal -->
            <button type="submit" class="btn btn-primary w-100">Enviar E-mail de Recuperação</button>
        </form>
    </div>
</main>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Auto-dismiss alertas
        document.querySelectorAll('.alert').forEach(function (el) {
            setTimeout(function () {
                el.classList.remove('show');
                setTimeout(function () { el.style.display = 'none'; }, 300);
            }, 5000);
        });

        const cpfInput = document.getElementById("cpf");

        cpfInput.addEventListener("input", function () {
            let value = cpfInput.value.replace(/\D/g, ""); // só números
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            cpfInput.value = value;
        });
    });
</script>

{% endblock %}
