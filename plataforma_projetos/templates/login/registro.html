{% extends "base.html" %}

{% block title %}Cadastro - PROPEG{% endblock %}

{% block content %}
<main class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f5f7fb;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">

        <h2 class="fw-bold mb-4 text-center">PROPEG</h2>

        <form method="post">
            {% csrf_token %}

            <div class="row mb-3">
                <div class="col">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome" required>
                </div>
                <div class="col">
                    <label for="sobrenome" class="form-label">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" class="form-control" placeholder="Digite seu sobrenome" required>
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Digite seu email" required>
            </div>

            <!-- Senha -->
            <div class="mb-3 position-relative">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
                <span class="position-absolute" style="top: 38px; right: 10px; cursor:pointer;" onclick="toggleSenha()">👁️</span>
            </div>

            <!-- Registrar-se Como -->
            <div class="mb-3">
                <label for="tipo_usuario" class="form-label">Registrar-se Como</label>
                <select id="tipo_usuario" name="tipo_usuario" class="form-select" required>
                    <option value="" disabled selected>Selecione uma opção</option>
                    <option value="coordenador">Coordenador</option>
                    <option value="aluno">Aluno</option>
                </select>
            </div>

            <!-- Botão principal -->
            <button type="submit" class="btn btn-primary w-100">Confirmar Cadastro</button>
        </form>

        <hr class="my-4">

        <p class="text-center">
            Já tem uma conta? <a href="{% url 'login' 'coordenador' %}" class="text-decoration-none">Log In</a>
        </p>
    </div>
</main>

<script>
    function toggleSenha() {
        const senhaInput = document.getElementById("senha");
        if (senhaInput.type === "password") {
            senhaInput.type = "text";
        } else {
            senhaInput.type = "password";
        }
    }
</script>
{% endblock %}
