{% extends "base2.html" %}
{% load crispy_forms_tags %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-3">Editar Perfil</h2>
    <hr>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <h5 class="mb-3">Informações Pessoais e Institucionais</h5>
                {{ user_form|crispy }}
                
                <hr class="my-4">
                
                <h5 class="mb-3">Endereço</h5>
                {{ endereco_form|crispy }}
                
                <div class="mt-4">
                    <a href="{% url 'perfil' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary float-end">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
