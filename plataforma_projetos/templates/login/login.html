{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<main class="auth-container">
    <div class="card auth-card shadow-sm">
        <a href="{% url 'home' %}" class="auth-back-arrow"><i class="bi bi-arrow-left"></i></a>
        
        <h2 class="auth-title">Log In</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required>
                    <button class="btn" type="button" id="toggleSenha">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center my-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Lembre de Mim</label>
                </div>
                <a href="{% url 'esqueceu_senha' %}" class="auth-link small">Esqueceu sua Senha?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>

        </form>

        <div class="auth-link">
            Não tem uma conta? <a href="{% url 'registrar' %}">Registre-se</a>
        </div>

    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.alert.alert-dismissible').forEach(function (el) {
        setTimeout(function () {
            el.classList.remove('show');
            setTimeout(function () { el.style.display = 'none'; }, 300);
        }, 5000);
    });
});
</script>
{% endblock %}
