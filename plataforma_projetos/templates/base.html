{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="container-fluid">
        <header>
            <nav class="navbar navbar-expand-lg bg-white shadow-sm">
                <div class="container-fluid">
                    <a class="navbar-brand d-flex align-items-center" href="/">
                        <img src="{% static 'imagens/logo_ufac.png' %}" alt="Logo UFAC" width="60" class="me-2">
                        <span><span class="fw-bold fs-4">PROPEG</span><br>Plataforma de Projetos Institucionalizados</span>
                    </a>
                    <div class="collapse navbar-collapse justify-content-end">
                        <ul class="navbar-nav">
                            <li class="nav-item"><a class="nav-link" href="/">Plataforma PROPEG</a></li>
                            <li class="nav-item"><a class="nav-link" href="mailto:dpesq.propeg@ufac.br">Contate-nos</a></li>
                            <li class="nav-item"><a class="nav-link" href="#">Registre-se</a></li>
                            <li class="nav-item"><a class="nav-link" href="https://www.ufac.br/site/ufac/propeg">Sobre nós</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        {% block content %}
        {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
