{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PROPEG | {% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>

        <div class="d-flex">

            <div id="sidebar" class="d-flex flex-column">
                <div class="sidebar-header">
                    <img src="{% static 'imagens/logo_ufac.png' %}" alt="Logo UFAC" width="50">
                    <span class="fs-4 fw-bold">PROPEG</span>
                </div>

                <ul class="nav flex-column my-3">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark" id="toggle-btn">
                            <i class="bi bi-list"></i>
                            <span>Retornar à Tela Inicial</span>
                        </a>
                    </li>
                    <li class="nav-item px-3 my-2">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control border-start-0" placeholder="Pesquisar">
                        </div>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link active"> <i class="bi bi-house-door-fill"></i>
                            <span>Tela Principal</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-folder"></i>
                            <span>Meus Projetos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-journal-text"></i>
                            <span>Editais Abertos</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link text-dark">
                            <i class="bi bi-plus-square"></i>
                            <span>Criar Novo Projeto</span>
                        </a>
                    </li>
                </ul>

                <div class="sidebar-footer mt-auto">
                    <a href="#" class="d-flex align-items-center text-dark text-decoration-none">
                        <i class="bi bi-person fs-4"></i>
                        <span class="ms-2">Usuário</span>
                    </a>
                    <div class="d-flex align-items-center">
                        <a href="#" class="text-dark position-relative me-3">
                            <i class="bi bi-bell fs-4"></i>
                            <!-- <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span> # ÍCONE DE NOTIFICAÇÂO DO SINO -->
                        </a>
                        <a href="#" class="text-dark">
                            <i class="bi bi-gear fs-4"></i>
                        </a>
                    </div>
                </div>
            </div>

            <main id="main-content">
                {% block content %}
                {% endblock %}
            </main>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
    </body>
</html>
