{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Redefinir sua senha</h3>
                    <p>Digite seu endereço de e-mail e enviaremos instruções para você criar uma nova senha.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Enviar e-mail de redefinição</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
