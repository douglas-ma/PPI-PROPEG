## Blueprint de implantação da Plataforma PROPEG no Render.

services:
  # ── Aplicação Web Django ────────────────────────────────────────────────────
  - type: web
    name: propeg-plataforma
    runtime: python
    region: oregon          # ou frankfurt se quiser mais próximo do Brasil
    plan: free
    rootDir: plataforma_projetos
    buildCommand: bash build.sh
    startCommand: gunicorn plataforma_projetos.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: plataforma_projetos.settings_prod
      - key: SECRET_KEY
        generateValue: true          # Render gera automaticamente
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: propeg-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_CPF
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        value: Administrador
      - key: ADMIN_LAST_NAME
        value: PROPEG
      - key: APROVACAO_CENTRO_LINK_HORAS
        value: "168"

  # ── Banco de dados PostgreSQL ───────────────────────────────────────────────
databases:
  - name: propeg-db
    databaseName: propeg
    user: propeg
    plan: free              # expira após 30 dias; atualize o plano para uso contínuo
    region: oregon
